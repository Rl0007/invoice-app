{% extends "base.html" %}

{% block content %}
<div class="mt-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Items Inventory</h1>
        <button onclick="document.getElementById('itemModal').classList.remove('hidden')" 
           class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition">
            + New Item
        </button>
    </div>

    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full leading-normal">
            <thead>
                <tr>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Item Name</th>
                    <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Price ₹</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        <span class="font-bold text-gray-700">#{{ item.id }}</span>
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        {{ item.name }}
                    </td>
                    <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
                        ₹{{ item.price }}
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="px-5 py-5 text-center text-gray-500 italic">
                        No items found Add one
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div id="itemModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3 text-center">
            <h3 class="text-lg leading-6 font-medium text-gray-900">Add New Item</h3>
            
            <div class="mt-2 px-7 py-3">
                <input id="new_item_name" type="text" placeholder="Item Name (e.g. Notebook)" 
                       class="mb-3 px-3 py-2 border rounded w-full"/>
                <input id="new_item_price" type="number" min="0" placeholder="Price (e.g. 50)" 
                       class="mb-3 px-3 py-2 border rounded w-full"/>
            </div>
            
            <div class="items-center px-4 py-3">
                <button id="saveItemBtn" class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700">
                    Save Item
                </button>
                <button onclick="document.getElementById('itemModal').classList.add('hidden')"
                        class="mt-2 px-4 py-2 bg-gray-200 text-gray-800 text-base font-medium rounded-md w-full shadow-sm hover:bg-gray-300">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('saveItemBtn').addEventListener('click', async function() {
        const name = document.getElementById('new_item_name').value;
        const price = document.getElementById('new_item_price').value;

        if (!name || !price) {
            alert("Please fill in both fields");
            return;
        }

        const response = await fetch('/api/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, price: price })
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert("Error creating item");
        }
    });
</script>
{% endblock %}
