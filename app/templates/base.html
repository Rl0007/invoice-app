<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <nav class="bg-white shadow-md mb-8">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold text-blue-600 hover:text-blue-800">
                InvoicePro
            </a>
            
            <div class="space-x-4">
                {% if current_user.is_authenticated %}
                    <a href="/customers" class="text-gray-600 hover:text-blue-500">Customers</a>
                    <a href="/invoices" class="text-gray-600 hover:text-blue-500">Invoices</a>
                    <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium">Logout</button>
                {% else %}
                    <a href="/login" class="text-gray-600 hover:text-blue-500">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-6">
        {% block content %}{% endblock %}
    </div>

    <script>
        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
